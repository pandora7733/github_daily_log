<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Github daily log login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login_styles.css') }}">
</head>
<body>
    <div class="container">
        <h3>My Github Daily Log</h3>
        <div class="upper">
        <h2>Login</h2>
        <form id="loginForm">
            <input type="email" id="email" placeholder="Email">
            <br>
            <input type="password" id="password" placeholder="Password">
            <br>
            <a href="sc" id="Pass">Forgot your Password?</a>
            <br>
            <button type="submit" id="signIn">Sign in</button>
        </form>
    </div>
        <a href="register" id="reg">Create new account</a>
        <br>
        <h5 id="or">Or continue with</h5>
        <div class="github">
            <img src="https://cdn-icons-png.flaticon.com/256/25/25231.png" alt="깃허브 고양이" id="cat">
            <a href="auth/github/register" id="git">sign in with Github</a>
        </div>
    </div>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="{{ url_for('static', filename='js/login.js') }}"></script>
</div>
</body>
</html>
